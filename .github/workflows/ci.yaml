name: Application checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      run_browser_tests:
        description: Run optional Playwright browser tests
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_browser_tests:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: mkdir -p /tmp/opencode
      - run: npm run check:release
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      # Failing tests also become annotations, which are readable without opening the logs.
      - run: npx tsx --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/github-test-reporter.mjs --test-reporter-destination=stdout tests/*.test.ts
      - run: npm run build
      - run: npm run check:build
      - run: npx playwright install --with-deps chromium
        if: inputs.run_browser_tests == true
      - run: npx playwright test
        if: inputs.run_browser_tests == true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && inputs.run_browser_tests == true
        with:
          name: chromium-failures
          path: test-results/
          retention-days: 7
  package:
    name: Packaged app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build the app image
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} -t aotyassistant:smoke .
      - run: npm run test:container:built
