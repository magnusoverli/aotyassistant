name: Publish Home Assistant images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const config = readFileSync('config.yaml', 'utf8');
          const version = /^version: "([0-9]+\.[0-9]+\.[0-9]+)"$/m.exec(config)?.[1];
          if (!version) throw new Error('Invalid release version');
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('Tag and manifest versions differ');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nimage=ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}\n`);
          NODE
  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.checks.outputs.image }}:${{ needs.checks.outputs.version }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ needs.checks.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
  publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          IMAGE: ${{ needs.checks.outputs.image }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-aarch64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Prepare store manifest after image publication
        env:
          IMAGE: ${{ needs.checks.outputs.image }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = readFileSync('config.yaml', 'utf8').replace(/^image:.*\n/gm, '');
          writeFileSync('config.prebuilt.yaml', `${config}\nimage: ${process.env.IMAGE}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: published-store-manifest
          path: config.prebuilt.yaml
      - name: Release instructions
        run: |
          echo 'Image published. Make the GHCR package public, verify an anonymous pull, then replace config.yaml with the published-store-manifest artifact and commit it. This ordering avoids pointing installations at a missing/private image.' >> "$GITHUB_STEP_SUMMARY"
