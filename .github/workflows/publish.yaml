name: Publish Home Assistant images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
  checks:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: version
        run: node scripts/check-release.mjs
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.checks.outputs.image }}:${{ needs.checks.outputs.version }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ needs.checks.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
  publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          IMAGE: ${{ needs.checks.outputs.image }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-aarch64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Prepare store manifest after image publication
        env:
          IMAGE: ${{ needs.checks.outputs.image }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = readFileSync('config.yaml', 'utf8').replace(/^image:.*\n/gm, '');
          writeFileSync('config.prebuilt.yaml', `${config}\nimage: ${process.env.IMAGE}\n`);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public release images
        run: node scripts/verify-release-image.mjs '${{ needs.checks.outputs.image }}' '${{ needs.checks.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: published-store-manifest
          path: config.prebuilt.yaml
      - name: Release instructions
        run: |
          echo 'Public amd64/aarch64 images verified. Download the published-store-manifest artifact and compare config.prebuilt.yaml with the release branch manifest. Apply any required difference before updating the store branch. The store version must reference the verified image.' >> "$GITHUB_STEP_SUMMARY"
