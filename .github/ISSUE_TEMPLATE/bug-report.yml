name: Bug report
description: Report a problem with the Home Assistant app
body:
  - type: markdown
    attributes:
      value: |
        Support covers the Home Assistant app. Check the troubleshooting guide before reporting a problem.
        Do not include tokens, cookies, recovery keys, backups, protected media URLs, or private music.
        Report sensitive security issues through the repository's Security tab.
  - type: input
    id: app-version
    attributes:
      label: Albums of the Year version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Home Assistant Core/Supervisor and Music Assistant versions/schema, architecture, browser/device, speaker integration, and Ingress or guest link.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials and private data before sharing.
