services:
  albums-of-the-year:
    build: .
    ports:
      - "${BIND_IP:-127.0.0.1}:3000:3000"
    environment:
      GUEST_URL: "${GUEST_URL:-http://localhost:3000}"
      PLAYBACK_MODE: demo
      DEMO_TRACK_SECONDS: "${DEMO_TRACK_SECONDS:-30}"
    volumes:
      - aoty-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  aoty-data:
