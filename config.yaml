name: Albums of the Year (development)
version: "0.3.9"
slug: albums_of_the_year
url: https://github.com/magnusoverli/aotyassistant
description: Private listening circle with artist/album browsing and turn-controlled experimental Music Assistant playback.
arch:
  - amd64
  - aarch64
startup: application
homeassistant: "2026.10.0"
hassio_api: true
hassio_role: default
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_entry: host
ingress_stream: true
panel_icon: mdi:album
panel_title: Albums of the Year
panel_admin: true
stage: experimental
host_network: false
watchdog: "http://[HOST]:[PORT:3000]/api/health"
backup: hot
backup_pre: "node /app/dist/server/backup-hook.js freeze"
backup_post: "node /app/dist/server/backup-hook.js thaw"
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: LAN guest/display endpoint and intentionally open host controls
webui: "http://[HOST]:[PORT:3000]/host"
environment:
  HA_ADDON: "1"
options:
  demo_track_seconds: 30
schema:
  guest_url: url?
  playback_mode: list(demo)?
  demo_track_seconds: int(1,3600)

image: ghcr.io/magnusoverli/aotyassistant
